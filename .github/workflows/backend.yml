name: Backend

on:
  push:
    branches: [main]
    paths: [backend/**, android/gradle/wrapper/**, android/gradlew, .github/workflows/backend.yml]
  pull_request:
    paths: [backend/**, android/gradle/wrapper/**, android/gradlew, .github/workflows/backend.yml]

jobs:
  postgis:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: bumpmap_test
          POSTGRES_USER: bumpmap_test
          POSTGRES_PASSWORD: bumpmap_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U bumpmap_test -d bumpmap_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and package the API
        env:
          PGHOST: 127.0.0.1
          PGPORT: ${{ job.services.postgres.ports[5432] }}
          PGDATABASE: bumpmap_test
          PGUSER: bumpmap_test
          PGPASSWORD: bumpmap_test
        run: ./android/gradlew -p backend --no-daemon test installDist
